name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build image and deploy via Kamal
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    defaults:
      run:
        working-directory: sandbox

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby (for Kamal CLI)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.4'
          bundler-cache: true
          working-directory: sandbox

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H 46.224.5.25 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          KLAVIYO_PRIVATE_KEY: ${{ secrets.KLAVIYO_PRIVATE_KEY }}
          KLAVIYO_PUBLIC_KEY: ${{ secrets.KLAVIYO_PUBLIC_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ERACUNI_API_USERNAME: ${{ secrets.ERACUNI_API_USERNAME }}
          ERACUNI_API_SECRET_KEY: ${{ secrets.ERACUNI_API_SECRET_KEY }}
          ERACUNI_API_TOKEN: ${{ secrets.ERACUNI_API_TOKEN }}
          SMTP_ADDRESS: ${{ secrets.SMTP_ADDRESS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DHL_API_KEY: ${{ secrets.DHL_API_KEY }}
          DHL_SUBSCRIPTION_KEY: ${{ secrets.DHL_SUBSCRIPTION_KEY }}
        run: bin/kamal deploy

      - name: Smoke check (HTTPS up?)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://www.surf-store.com/up)
            if [ "$code" = "200" ]; then
              echo "Site healthy (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code - retry in 4s"
            sleep 4
          done
          echo "Site did not return 200 after 5 retries"
          exit 1
